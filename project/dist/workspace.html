<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Workspace — A2B Labs</title>
  <script src="theme.js?v=angstrom-51"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500&family=Space+Mono&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Hanken+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="code-colors.css?v=angstrom-51"/>
  <link rel="stylesheet" href="vs-dropzone.css?v=angstrom-51"/>
  <link rel="stylesheet" href="vs-breadcrumb-trail.css?v=angstrom-51"/>
  <link rel="stylesheet" href="angstrom.css?v=angstrom-51"/>
</head>
<body class="workspace-page ws-new-layout">
  <a class="skip-link" href="#main-workspace">Skip to workspace</a>

  <!-- Centered Mac Glass Top Header -->
  <header class="ang-header">
    <div class="ang-header-inner">
      <a href="/" class="ang-brand" aria-label="A2B Labs home">
        <div class="ang-brand-top">
          <svg class="ang-brand-logo" viewBox="0 0 32 32" fill="none" aria-hidden="true">
            <rect x="1.5" y="1.5" width="29" height="29" rx="8" class="ang-logo-tile"/>
            <circle cx="8.5" cy="19.5" r="2.5" class="ang-logo-node-a"/>
            <path d="M12.2 19.5H19.4" stroke="currentColor" stroke-opacity="0.32" stroke-width="1.6" stroke-linecap="round"/>
            <path d="M9.5 14.5C12.2 9.2 19.8 9.2 22.5 14.5" stroke="#f59e0b" stroke-width="2.15" stroke-linecap="round"/>
            <path d="M19.7 14.9L22.9 15.2L23.2 12" stroke="#f59e0b" stroke-width="2.15" stroke-linecap="round" stroke-linejoin="round"/>
            <rect x="21" y="17.1" width="4.8" height="4.8" rx="1.3" class="ang-logo-node-b"/>
          </svg>
          <span>A2B Labs</span>
        </div>
      </a>

      <nav class="vs-breadcrumb-trail ang-center-nav" aria-label="Main navigation" data-max="4" data-sep="none">
        <ol>
          <li>
            <a href="/">Home</a>
          </li>
          <li>
            <a href="/workspace.html" aria-current="page">Workspace</a>
            <ul>
              <li><a href="/workspace.html">Review &amp; Edit Files</a></li>
              <li><a href="/summary.html">Summary &amp; Export (.zip)</a></li>
            </ul>
          </li>
          <li>
            <a href="/about.html">About</a>
            <ul>
              <li><a href="/about.html#how-it-works">How It Works</a></li>
              <li><a href="/about.html#features">Features</a></li>
              <li><a href="/about.html#examples">Examples</a></li>
              <li><a href="/about.html#privacy">Privacy</a></li>
            </ul>
          </li>
        </ol>
      </nav>

      <div class="ang-header-tools">
        <button class="ang-tool-btn" type="button" data-motion-toggle>⏸ Pause background</button>
        <button class="ang-tool-btn" type="button" data-theme-toggle>☀ Light mode</button>
      </div>
    </div>
  </header>

  <!-- Workspace Two-Column Shell: File Queue Sidebar (Left) + Queue Viewer & Annotations (Right) -->
  <div class="ws-wireframe-shell">
    <aside class="ws-queue-sidebar" id="workspace-sidebar" aria-label="File queue sidebar">
      <div class="ws-sidebar-top">
        <div class="queue-head-row">
          <div class="queue-head-left">
            <button
              type="button"
              class="queue-collapse-btn"
              id="sidebar-collapse-toggle"
              aria-expanded="true"
              aria-controls="workspace-sidebar"
              aria-label="Collapse file queue sidebar"
              title="Collapse file queue sidebar"
            >
              <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="2" y="2.5" width="14" height="13" rx="2.5"/>
                <line x1="6.5" y1="2.5" x2="6.5" y2="15.5"/>
                <path class="collapse-chevron" d="M11.5 6.8L9.3 9l2.2 2.2"/>
              </svg>
            </button>
            <span class="queue-head-title">
              <span>Your Files</span>
              <span class="queue-count-pill" id="queue-count-pill">1</span>
            </span>
          </div>
          <a class="queue-add-btn" id="sidebar-add-file-btn" href="/" title="Add or create more sample files">
            <span class="queue-add-plus" aria-hidden="true">+</span>
            <span class="queue-add-label">Add Files</span>
          </a>
        </div>
        <div class="sidebar-queue-list" id="sidebar-queue-list" role="list" aria-label="Queued files"></div>
      </div>

      <!-- Bottom CTA: Highlights when all files in queue have been approved -->
      <div class="ws-sidebar-bottom-cta" id="sidebar-summary-cta-box">
        <div class="ws-sidebar-progress-label" id="sidebar-approval-progress">0 of 1 files approved</div>
        <a class="ws-queue-summary-btn" id="sidebar-summary-step" href="/summary.html" title="View Summary and Export">
          <span class="ws-summary-rail-icon" aria-hidden="true">
            <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2.5" y="2.5" width="13" height="13" rx="2.5"/>
              <path d="M6 11.5v-3M9 11.5v-5M12 11.5v-2"/>
            </svg>
          </span>
          <span class="ws-summary-btn-copy">
            <span class="ws-summary-btn-title">View Summary &amp; Export</span>
            <small id="sidebar-summary-sub">Approve every file to highlight your summary</small>
          </span>
        </a>
      </div>
    </aside>

    <main id="main-workspace" class="ws-queue-viewer-main">
      <div class="ang-scanline-track" aria-hidden="true">
        <div class="ang-scanline-beam" id="telemetry-beam"></div>
      </div>
      <div class="cockpit-wrap ws-qv-wrap">
        <div id="content" aria-live="polite"></div>
      </div>
    </main>
  </div>

  <script src="fixtures.js?v=angstrom-51"></script>
  <script src="code-colors.js?v=angstrom-51"></script>
  <script src="vs-dropzone.js?v=angstrom-51"></script>
  <script src="vs-breadcrumb-trail.js?v=angstrom-51"></script>
  <script src="app.js?v=angstrom-51"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
  <script src="macro-bench.js?v=angstrom-51"></script>
</body>
</html>
